/* TinyEMU: Debian 13 riscv64, kernel 6.12, OpenSBI fw_jump */
{
    version: 1,
    machine: "riscv64",
    memory_size: 512,
    bios: "fw_jump.bin",
    kernel: "linux-6.12.113-riscv64.bin",
    initrd: "initrd-6.12.113-riscv64.img",
    cmdline: "earlycon console=ttyS0 root=/dev/vda rw audit=0 systemd.mask=serial-getty@hvc0.service systemd.set_credential=firstboot.locale:C.UTF-8 systemd.set_credential=firstboot.keymap:us systemd.set_credential=firstboot.timezone:UTC systemd.set_credential=passwd.plaintext-password.root:debian",
    drive0: { file: "root/blk.txt" },
}
